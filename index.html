<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f4f0" />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Guàrdies" />
    <title>Guàrdies | IES Josep Sureda i Blanes</title>
    <script>
      try {
        document.documentElement.classList.toggle(
          'dark',
          localStorage.getItem('quota_theme') === 'dark' || localStorage.getItem('darkMode') === 'true'
        );
      } catch (_) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..700&amp;family=Figtree:wght@400..900&amp;display=swap" />
    <link rel="stylesheet" href="/labs/guardies/styles.css" />
    <script>
      // Els estils fan servir capes CSS (@layer), disponibles des del 2022. Un navegador
      // sense suport mostraria la pàgina sense estils: se li avisa de manera clara.
      if (!('CSSLayerBlockRule' in window)) {
        document.addEventListener('DOMContentLoaded', function () {
          var box = document.createElement('div');
          box.id = 'outdated-browser';
          box.setAttribute('role', 'alert');
          box.style.cssText = 'margin:16px;padding:16px;border:2px solid #8a4300;border-radius:10px;background:#fff0dd;color:#15171c;font:16px/1.4 system-ui,sans-serif';
          box.textContent = 'Aquest navegador és massa antic per mostrar Guàrdies correctament. Actualitza el sistema o el navegador (Safari 15.4, Chrome 99, Firefox 97 o posteriors).';
          document.body.insertBefore(box, document.body.firstChild);
        });
      }
    </script>
    <script type="module" src="/labs/guardies/entry.js"></script>
  </head>
  <body class="guardies-app">
    <div id="guardies-chrome-root"></div>

    <main class="page">
      <div id="guardies-work-header-root"></div>
      <section id="error-box" class="alert hidden" role="alert"></section>
      <div id="guardies-setup-root"></div>
      <div id="guardies-pati-root"></div>
      <div id="guardies-convivencia-root"></div>
      <div id="guardies-release-notes-root"></div>
      <div id="guardies-workspace-root"></div>
    </main>
  </body>
</html>
